name: Deploy Blog

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy to VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_TARGET: ${{ secrets.VPS_TARGET }}
        run: |
          set -e
          # Setup SSH key
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 10022 -H "${VPS_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

          # Ensure target directory exists
          ssh -p 10022 -o StrictHostKeyChecking=no "${VPS_USER}@${VPS_HOST}" "mkdir -p ${VPS_TARGET}"

          # Deploy via tar over SSH (no rsync needed)
          tar czf - -C ./public . | ssh -p 10022 -o StrictHostKeyChecking=no "${VPS_USER}@${VPS_HOST}" "tar xzf - -C ${VPS_TARGET}"
